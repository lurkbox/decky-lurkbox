# Runs on every pull request and on pushes to main. Branch protection on main requires these jobs to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build and backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: python3 -m unittest discover -s tests -v
      - name: Versions agree
        run: |
          PKG=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          PLG=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          [ "$PKG" = "$PLG" ] || { echo "package.json $PKG != plugin.json $PLG"; exit 1; }
      - name: Package zip
        run: sh package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: decky-lurkbox-zip
          path: out/*.zip
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact
