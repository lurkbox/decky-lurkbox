# On a tag push (v1.2.3 or 1.2.3), build the plugin zip and attach it to the GitHub release.
# DeckyHub installs from release ZIPs named decky-lurkbox-<version>.zip; package.json and plugin.json must carry
# the tag's version.
name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]

# Read-only by default; only the publish job may write (to create the release and attach the zip).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          PLG=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          echo "tag $TAG, package.json $PKG, plugin.json $PLG"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$PLG" ]

      - name: Backend tests
        run: python3 -m unittest discover -s tests -v

      - name: Build and package
        run: sh package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip
          path: out/decky-lurkbox-*.zip
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip
          path: out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="out/decky-lurkbox-${GITHUB_REF_NAME#v}.zip"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
