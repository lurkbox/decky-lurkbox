# On a tag push (v1.2.3 or 1.2.3), build the plugin zip and attach it to the GitHub release.
# DeckyHub installs from release ZIPs named decky-lurkbox-<version>.zip; package.json and plugin.json must carry
# the tag's version.
name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          PLG=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          echo "tag $TAG, package.json $PKG, plugin.json $PLG"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$PLG" ]

      - name: Backend tests
        run: python3 -m unittest discover -s tests -v

      - name: Build and package
        run: sh package.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="out/decky-lurkbox-${GITHUB_REF_NAME#v}.zip"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
